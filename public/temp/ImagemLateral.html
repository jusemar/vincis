<script>
        let currentTab = 0;

        function switchTab(index) {
            if (index === currentTab) return;

            const tabsCount = 3;
            for (let i = 0; i < tabsCount; i++) {
                const tab = document.getElementById(`tab-${i}`);
                const img = document.getElementById(`img-${i}`);
                const icon = tab.querySelector('.material-symbols-outlined');

                if (i === index) {
                    // Activate Tab
                    tab.classList.add('tab-active');
                    tab.classList.remove('hover:bg-surface-bright/5');
                    
                    // Show Image
                    img.classList.remove('opacity-0', 'scale-105');
                    img.classList.add('opacity-100', 'scale-100');
                    
                    if (icon) {
                        icon.classList.remove('text-text-muted');
                        icon.classList.add('text-primary');
                    }
                } else {
                    // Deactivate Tab
                    tab.classList.remove('tab-active');
                    tab.classList.add('hover:bg-surface-bright/5');
                    
                    // Hide Image
                    img.classList.add('opacity-0', 'scale-105');
                    img.classList.remove('opacity-100', 'scale-100');
                    
                    if (icon) {
                        icon.classList.add('text-text-muted');
                        icon.classList.remove('text-primary');
                    }
                }
            }

            currentTab = index;

            // On mobile, scroll the active tab into view
            if (window.innerWidth < 1024) {
                const activeTab = document.getElementById(`tab-${index}`);
                activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        }
    </script>
